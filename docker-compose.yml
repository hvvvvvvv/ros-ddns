services:
  ros-ddns:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ros-ddns:local
    container_name: ros-ddns
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Copy .env.example to .env, replace placeholders, and chmod 600 .env.
    env_file:
      - .env
    ports:
      # Override the host bind in .env when 8080 is already in use.
      - "${ROS_DDNS_HTTP_BIND:-127.0.0.1:8080}:8080"
    # Mount the directory: WebUI saves use atomic rename and a config.yaml.bak.
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
