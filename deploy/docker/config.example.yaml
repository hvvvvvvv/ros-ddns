# Copy to data/config.yaml; chown 10001:10001 data data/config.yaml.
# Use chmod 700 data and chmod 600 data/config.yaml.
# Mount the whole writable data directory: WebUI saves config atomically and
# creates config.yaml.bak. A read-only or single-file mount prevents saves.
log:
  level: info
  format: text

runtime:
  pollInterval: 10s
  stableFor: 0s
  reconcileTimeout: 30s
  verifyInterval: 10m
  syncOnStart: true
  maxBackoff: 5m

state:
  # Compose pins the instance lock to /data/state.json.lock, so a WebUI
  # state.path hot reload does not move the lock held by this process.
  path: /data/state.json

api:
  # Container must listen on all interfaces for the published port to work.
  # Compose publishes only on host 127.0.0.1; a non-empty token is still required.
  listen: 0.0.0.0:8080
  token: ${ROS_DDNS_API_TOKEN}

routeros:
  url: https://192.168.88.1  # Replace with your router's trusted HTTPS endpoint.
  username: ddns-api
  password: ${ROS_PASSWORD}
  timeout: 10s
  tls:
    insecureSkipVerify: false
    caFile: ""  # For a private CA, put its PEM in data and use /data/router-ca.pem.

dns:
  providers:
    ali-main:
      type: aliyun
      endpoint: alidns.aliyuncs.com
      regionId: cn-hangzhou
      accessKeyId: ${ALI_ACCESS_KEY_ID}
      accessKeySecret: ${ALI_ACCESS_KEY_SECRET}
      securityToken: ${ALI_SECURITY_TOKEN:-}
      timeout: 10s
      qps: 5

items:
  - name: home-ipv4
    source:
      interface: pppoe-out1  # Replace with the actual source interface.
      family: ipv4
      select:
        scope: public
        index: 0
    domains:
      - provider: ali-main
        domain: example.com  # Replace with a domain in your Aliyun account.
        rr: home
        ttl: 600
        line: default
    # Optional RouterOS list; remove this block when only DNS is needed.
    addressList:
      list: ddns-home-ipv4
