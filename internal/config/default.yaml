# ros-ddns 默认配置：仅在守护进程启动时发现配置文件缺失才生成，手动与服务方式相同。
# YAML 语法或类型 / 解码错误会使启动失败，原文件保持不变。
# 指定必须参数的显式非法语义值会在启动时修复并尝试回写，先备份为 .bak；
# 环境占位符通常只在内存回退，非回环监听自动生成的 token 除外。
# 仅包含基础设置；启动后通过 WebUI 添加 DNS 服务商、同步项目，或手工编辑配置。
#
# 以下环境引用均带默认值，服务管理器未提供变量时也可加载。
# Docker Compose 可通过 env_file 注入变量。
log:
  level: ${ROS_DDNS_LOG_LEVEL:-info}
  format: ${ROS_DDNS_LOG_FORMAT:-text}

runtime:
  pollInterval: ${ROS_DDNS_POLL_INTERVAL:-10s}
  stableFor: ${ROS_DDNS_STABLE_FOR:-0s}
  reconcileTimeout: ${ROS_DDNS_RECONCILE_TIMEOUT:-30s}
  verifyInterval: ${ROS_DDNS_VERIFY_INTERVAL:-10m}
  syncOnStart: ${ROS_DDNS_SYNC_ON_START:-true}
  maxBackoff: ${ROS_DDNS_MAX_BACKOFF:-5m}

state:
  # 生成文件会把下方默认路径替换为配置目录下的绝对路径；ROS_DDNS_STATE_PATH 可覆盖。
  # 显式空字符串表示仅内存模式，合法且不会触发回写。
  path: ${ROS_DDNS_STATE_PATH:-state.json}

api:
  # 默认回环监听。容器应设置 ROS_DDNS_LISTEN=0.0.0.0:8080，并预先提供合法非空 token。
  # 非回环启动时 token 为空或非法会自动生成、尝试写回字面值，并在启动日志打印一次。
  # 成功回写后 ROS_DDNS_API_TOKEN 不再覆盖该值；api.listen/token/log.format 修改需重启。
  listen: ${ROS_DDNS_LISTEN:-127.0.0.1:8080}
  token: ${ROS_DDNS_API_TOKEN:-}

routeros:
  url: ${ROS_DDNS_ROUTEROS_URL:-https://192.168.88.1}
  username: ${ROS_DDNS_ROUTEROS_USERNAME:-admin}
  password: ${ROS_PASSWORD:-}
  timeout: 10s
  tls:
    # 自签名路由器可开启此项，或设置 caFile 信任其 PEM CA；两者互斥。
    # 若改为环境引用，展开值必须是 true/false。
    insecureSkipVerify: false
    caFile: ${ROS_DDNS_CA_FILE:-}
