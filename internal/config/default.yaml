# Default ros-ddns configuration, written on a daemon start when the configured
# file does not exist (or when a service-managed start cannot load it).
# Only basic runtime settings are included. After startup, add DNS providers
# and synchronization items through the WebUI, or edit the configuration by hand.
#
# Every environment reference below has a default, so a service manager without
# a shell environment still loads this file. Docker Compose can override the
# values through its env_file.
log:
  level: ${ROS_DDNS_LOG_LEVEL:-info}
  format: ${ROS_DDNS_LOG_FORMAT:-text}

runtime:
  pollInterval: ${ROS_DDNS_POLL_INTERVAL:-10s}
  stableFor: ${ROS_DDNS_STABLE_FOR:-0s}
  reconcileTimeout: ${ROS_DDNS_RECONCILE_TIMEOUT:-30s}
  verifyInterval: ${ROS_DDNS_VERIFY_INTERVAL:-10m}
  syncOnStart: ${ROS_DDNS_SYNC_ON_START:-true}
  maxBackoff: ${ROS_DDNS_MAX_BACKOFF:-5m}

state:
  # The generated file replaces the fallback below with an absolute path under
  # the configuration directory; ROS_DDNS_STATE_PATH can override it.
  path: ${ROS_DDNS_STATE_PATH:-state.json}

api:
  # Loopback by default. A container should set ROS_DDNS_LISTEN=0.0.0.0:8080 and
  # a non-empty ROS_DDNS_API_TOKEN; api.listen/token/log.format changes need a restart.
  listen: ${ROS_DDNS_LISTEN:-127.0.0.1:8080}
  token: ${ROS_DDNS_API_TOKEN:-}

routeros:
  url: ${ROS_DDNS_ROUTEROS_URL:-https://192.168.88.1}
  username: ${ROS_DDNS_ROUTEROS_USERNAME:-admin}
  password: ${ROS_PASSWORD:-}
  timeout: 10s
  tls:
    # Enable this only for a self-signed router, or set caFile to a trusted PEM.
    # If referenced from the environment, the expanded value must be true/false.
    insecureSkipVerify: false
    caFile: ${ROS_DDNS_CA_FILE:-}
